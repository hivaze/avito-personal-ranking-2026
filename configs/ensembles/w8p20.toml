# W8P20, the file with the team's best public score, one of the two candidates for the second pick.
# The name: 8 full-view students (W8, width 192) and a popularity-light pool at weight 0.2 (P20) of
# 4 narrow popularity-light students (width 128). Its 12 members were trained without the 30,000
# holdout feeds of train, and each kept the checkpoint that scored best on those feeds.

name = "W8P20"

[members]
# Member names are the names of the runs: prediction files and logs carry them.
# The order is part of the recipe. Pooling adds float32 arrays in this order,
# and another order changes the last bit of a few scores.
full_view = [
    "w5_e10_kd05w192_s951", "w5_e10_kd05w192_s952", "w5_e10_kd05w192_s953", "w5_e10_kd05w192_s954",
    "w5_e10_kd05t25w192_s951", "w5_e10_kd05t25w192_s952", "w5_e10_kd05t25w192_s953", "w5_e10_kd05t25w192_s954",
]
popularity_light = [
    "abl_e10_pop1kd05t25_s951", "abl_e10_pop1kd05t25_s952", "abl_e10_pop1kd05t25_s953", "abl_e10_pop1kd05t25_s954",
]

[weights]
popularity_light = 0.2    # each branch: 0.8 z(full-view pool) + 0.2 z(popularity-light pool)
finetuned_branch = 0.5    # final score: 0.5 z(fine-tuned branch) + 0.5 z(train-only branch)

[files]
finetune_tag = "n2cpv3s3"                  # tag of the fine-tune recipe in member file and log names
pool_tag = "W8P20kd"                       # pools: ens_<pool_tag>_{ft,to}_{val,test}.npy in the predictions folder
submission = "cand_W8P20kd_r3.parquet"     # in the submissions folder

[gate]
reference_pool_tag = "W8kd"                # the gate measures this file against the stored pools of W8 (its 8 full-view students alone)

[record]
sha256 = "406e5705cef75d264118eeb20102ab963cedf6d00b0b7c6be7c2f1b1361a4d78"
val_ndcg = 0.40214                         # validation, 14,423 feeds
public_ndcg = 0.3950094                    # public leaderboard, scored 2026-11-15
gate_output = "gate_W8P20kd.txt"
