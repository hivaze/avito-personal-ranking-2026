# FD16P20vf: FD16P20 plus 4 popularity-free students, one of the two candidates for the second pick.
# The same 16 full-view students (width 192, trained on every train feed). The pool at weight 0.2
# holds the 4 popularity-light students of FD16P20 and 4 popularity-free students, trained with
# no popularity input at all (names with "pf").

name = "FD16P20vf"

[members]
# Member names are the names of the runs: prediction files and logs carry them.
# The order is part of the recipe. Pooling adds float32 arrays in this order,
# and another order changes the last bit of a few scores.
full_view = [
    "w5_fd10_kd05w192_s951", "w5_fd10_kd05w192_s952", "w5_fd10_kd05w192_s953", "w5_fd10_kd05w192_s954",
    "w5_fd10_kd05w192_s955", "w5_fd10_kd05w192_s956", "w5_fd10_kd05w192_s957", "w5_fd10_kd05w192_s958",
    "w5_fd10_kd05t25w192_s951", "w5_fd10_kd05t25w192_s952", "w5_fd10_kd05t25w192_s953", "w5_fd10_kd05t25w192_s954",
    "w5_fd10_kd05t25w192_s955", "w5_fd10_kd05t25w192_s956", "w5_fd10_kd05t25w192_s957", "w5_fd10_kd05t25w192_s958",
]
popularity_light = [
    "abl_fd10_pop1kd05w192_s951", "abl_fd10_pop1kd05w192_s952", "abl_fd10_pop1kd05w192_s953", "abl_fd10_pop1kd05w192_s954",
    "abl_fd10_pfkd05w192_s951", "abl_fd10_pfkd05w192_s952", "abl_fd10_pfkd05w192_s953", "abl_fd10_pfkd05w192_s954",
]

[weights]
popularity_light = 0.2    # each branch: 0.8 z(full-view pool) + 0.2 z(popularity-light pool)
finetuned_branch = 0.5    # final score: 0.5 z(fine-tuned branch) + 0.5 z(train-only branch)

[files]
finetune_tag = "n2cpv3s3"                    # tag of the fine-tune recipe in member file and log names
pool_tag = "FD16P20vfkd"                     # pools: ens_<pool_tag>_{ft,to}_{val,test}.npy in the predictions folder
submission = "cand_FD16P20vfkd_r4.parquet"   # in the submissions folder

[gate]
reference_pool_tag = "W8P20kd"               # the gate measures this file against the stored pools of W8P20

[record]
