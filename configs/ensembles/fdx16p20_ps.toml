# FDX16P20:ps, the second final pick (decided 2026-11-19; W8P20 was the second pick before it).
# The design of FD16P20 with its 16 full-view students replaced by 16 students trained the same way on all
# train feeds plus pseudo-feeds built from user histories (lab/nn_x/w12/pseudokd/train_full_pk.py; the package
# trainer does not have the pseudo-feed option). The 4 popularity-light students are those of FD16P20.
# Half of the full-view students learned from the teacher averaged over 11 members (names with "kd05w192"),
# half from the teacher averaged over 25 (names with "kd05t25w192").

name = "FDX16P20:ps"

[members]
# Member names are the names of the runs: prediction files and logs carry them.
# The order is part of the recipe. Pooling adds float32 arrays in this order,
# and another order changes the last bit of a few scores.
full_view = [
    "w5_fdxps_kd05w192_s951", "w5_fdxps_kd05w192_s952", "w5_fdxps_kd05w192_s953", "w5_fdxps_kd05w192_s954",
    "w5_fdxps_kd05w192_s955", "w5_fdxps_kd05w192_s956", "w5_fdxps_kd05w192_s957", "w5_fdxps_kd05w192_s958",
    "w5_fdxps_kd05t25w192_s951", "w5_fdxps_kd05t25w192_s952", "w5_fdxps_kd05t25w192_s953", "w5_fdxps_kd05t25w192_s954",
    "w5_fdxps_kd05t25w192_s955", "w5_fdxps_kd05t25w192_s956", "w5_fdxps_kd05t25w192_s957", "w5_fdxps_kd05t25w192_s958"
]
popularity_light = [
    "abl_fd10_pop1kd05w192_s951", "abl_fd10_pop1kd05w192_s952", "abl_fd10_pop1kd05w192_s953", "abl_fd10_pop1kd05w192_s954",
]

[weights]
popularity_light = 0.2    # each branch: 0.8 z(full-view pool) + 0.2 z(popularity-light pool)
finetuned_branch = 0.5    # final score: 0.5 z(fine-tuned branch) + 0.5 z(train-only branch)

[files]
finetune_tag = "n2cpv3s3"                  # tag of the fine-tune recipe in member file and log names
pool_tag = "FDX16P20_pskd"                  # pools: ens_<pool_tag>_{ft,to}_{val,test}.npy in the predictions folder
submission = "cand_FDX16P20_pskd_r4.parquet"   # in the submissions folder

[gate]
reference_pool_tag = "W8P20kd"             # the gate measures this file against the stored pools of W8P20

[record]
sha256 = "8235c55cb35931129a845ce6825a94913f81bebb51824f84bced6eadfb1571db"
val_ndcg = 0.40286                         # validation, 14,423 feeds
public_ndcg = 0.39526061                   # public leaderboard, scored 2026-11-18
gate_output = "gate_FDX16P20_pskd.txt"
